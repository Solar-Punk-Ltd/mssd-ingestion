name: Build and Deploy to VPS (PM2 + SRS)

on:
  push:
    branches:
      - prod
      - test
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'Prod' || 'Test' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build

      - name: Generate .env file
        run: |
          echo "BEE_URL=${{ secrets.BEE_URL }}" >> .env
          echo "MANIFEST_ACCESS_URL=${{ secrets.MANIFEST_ACCESS_URL }}" >> .env
          echo "GSOC_RESOURCE_ID=${{ secrets.GSOC_RESOURCE_ID }}" >> .env
          echo "GSOC_TOPIC=${{ secrets.GSOC_TOPIC }}" >> .env
          echo "STREAM_KEY=${{ secrets.STREAM_KEY }}" >> .env
          echo "STAMP=${{ secrets.STAMP }}" >> .env
          echo "WEBHOOK_PORT=${{ secrets.WEBHOOK_PORT || '3000' }}" >> .env
          echo "SRS_SRT_PORT=${{ secrets.SRS_SRT_PORT || '10080' }}" >> .env
          echo "SRT_PASSPHRASE=${{ secrets.SRT_PASSPHRASE }}" >> .env
          echo "SRS_MEDIA_PATH=${{ secrets.SRS_MEDIA_PATH || '../media' }}" >> .env
        shell: bash

      - name: Stop old services on VPS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export APP_HOME=${{ secrets.APP_HOME }}
            export PATH="$APP_HOME/.nvm/versions/node/v22.9.0/bin:$PATH"
            pm2 delete ingestion || true
            cd ~/mssd-ingestion/srs && docker compose down || true
            docker run --rm -v ~/mssd-ingestion/media:/media alpine rm -rf /media/video /media/audio || true
            rm -rf ~/mssd-ingestion

      - name: Upload project files
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'dist,node_modules,.env,ecosystem.config.js,srs'
          target: '~/mssd-ingestion'

      - name: Start SRS and app
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export APP_HOME=${{ secrets.APP_HOME }}
            export PATH="$APP_HOME/.nvm/versions/node/v22.9.0/bin:$PATH"
            cd ~/mssd-ingestion

            # Start SRS media server
            cd srs && docker compose up -d && cd ..

            # Wait for SRS to be ready
            sleep 3

            # Start Node app with PM2
            pm2 start ecosystem.config.js
